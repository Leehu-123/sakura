name: sakura
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Chay npm run setup:env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Thieu mat khau database}
      POSTGRES_DB: ${POSTGRES_DB:-sakura}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: { context: ., target: api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ['npm', 'run', 'db:migrate']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'
  seed:
    build: { context: ., target: api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    command: ['npm', 'run', 'db:seed']
    depends_on:
      migrate: { condition: service_completed_successfully }
    profiles: ['setup']
    restart: 'no'
  api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:8080}
      TRUST_PROXY_HOPS: 1
      MEDIA_ROOT: /data/media
    volumes:
      - media_data:/data/media
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  worker:
    build: { context: ., target: worker }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
  web:
    build: { context: ., target: web }
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  media_data:
