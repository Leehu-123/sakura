server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sakura.ldhuy.name.vn;
    ssl_certificate /srv/sakura/tls/fullchain.pem;
    ssl_certificate_key /srv/sakura/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/sakura/current/apps/sale-web/dist;
    index index.html;
    client_max_body_size 1m;
    # No query string in access logs: OAuth code and webhook verify token are secrets.
    access_log /var/log/nginx/sakura.access.log sakura_safe;
    error_log /var/log/nginx/sakura.error.log;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location ~ ^/(?:\.env|\.git|\.local|backup/|media/|api/docs) { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
    location = /api/v1/imports/sapo/excel/preview {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location / {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Cache-Control no-cache;
        try_files $uri $uri/ /index.html;
    }
}
